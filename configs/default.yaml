# Single source of truth for every script. Change values here, not in code.
# Every result in results/ must record which config + seed produced it.

seed: 42

paths:
  scb_root: data/raw/scb            # unzipped SCB subset(s); not committed
  dipser_root: data/raw/dipser      # second test set; not committed
  manifest: data/processed/manifest.jsonl
  splits: data/processed/splits.json
  questions_dir: data/processed/questions
  results_dir: results
  scene_tags: configs/scene_tags.csv   # exam yes/no per Roboflow scene (RQ3 scored on "yes" only)

# ---------------------------------------------------------------------------
# Behaviours and lesson rules
# ---------------------------------------------------------------------------
# rules.csv holds the rule table: one row per behaviour, one column per lesson
# type. Each cell is flag | ok | unused.  "unused" = ambiguous; the behaviour is
# ignored (not scored) for that lesson type.
rules_csv: configs/rules.csv

# Map dataset class names (exactly as in each dataset's yaml) -> our behaviour names.
# Classes available (checked 16-17 Oct):
#   SCB (HF): discuss, TurnHead, BowHead, hand-raising, read, write
#   Roboflow exam_cheating v2 (checked 17 Oct, passes): Use_phone, Look_around, Cheat_paper, Normal
#     Every student is boxed (Normal = not cheating). Use_phone boxes the PHONE, not the student.
# Behaviours = decision D1 (decisions.md #12, 17 Oct). Every behaviour in rules.csv must appear here.
scb_class_map:
  discuss: talking
  TurnHead: turning_head
  Look_around: turning_head          # Roboflow; same action as SCB TurnHead (merged, D1)
  hand-raising: hand_raising
  Use_phone: using_phone             # Roboflow; box is on the phone (decisions #26)
  Cheat_paper: reading_notes         # Roboflow
  # Not used: BowHead (ambiguous: often note-taking), read / write (labels not checked).
  # Normal is not a behaviour: photos with only Normal boxes become "no one" examples.

# ---------------------------------------------------------------------------
# Settings ("contexts" in the code) = decision D2 (decisions.md #27)
# ---------------------------------------------------------------------------
# Each setting is a column in rules.csv. The sentence names the situation AND its purpose
# (who is checking for what; decisions #37), never the behaviours (otherwise the text gives
# the answer away and RQ2 tests nothing).
# canonical: used for train, validation and the main test.
# paraphrases: NEVER used in training; only for the reworded-setting test.
contexts:
  lecture:
    canonical: "This is a lecture. The lecturer wants to know which students are not paying attention."
    paraphrases:
      - "The teacher is giving a talk and wants to spot students who are off-task."
      - "During this lecture, the lecturer is looking for students who are distracted."
  closed_book_exam:
    canonical: "This is a closed-book exam. The invigilator is checking for possible cheating."
    paraphrases:
      - "Students are sitting a written test without notes or books, and staff are watching for rule-breaking."
      - "An examination with no materials allowed is in progress; the invigilator looks for suspicious behaviour."
  participation:
    canonical: "This is a lesson, and the teacher is checking which students are taking part."
    paraphrases:
      - "The teacher wants to see who is actively participating in class."
      - "Class participation is being recorded for this lesson."

train_contexts: [lecture, closed_book_exam]
# Held out = never in train or val. Tests whether the text alone can switch the model to
# an application it was never trained on (decisions.md #29).
heldout_contexts: [participation]

# Neutral wording: the participation setting points out GOOD behaviour, so the question
# must not say "does not fit" or "for review". The JSON key stays "flagged".
# 18 Oct (decisions #36): "Consider" (not "Look for") so the list sets the scope, not the
# target; one neutral sentence that the situation matters (it does not reveal the table).
question: >-
  {context} Consider only these behaviours: {behaviours}.
  Whether a behaviour should be pointed out depends on the situation.
  Which students should be pointed out in this situation, if any?
  Answer only with JSON in this format:
  {{"flagged": [{{"bbox_2d": [x1, y1, x2, y2], "behaviour": "<one of: {behaviours}>"}}],
  "reason": "<one sentence>"}}. Use {{"flagged": [], "reason": "..."}} if no one.

# ---------------------------------------------------------------------------
# Split
# ---------------------------------------------------------------------------
split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  # Regex with a named group 'src' = source video, from the file name.
  # SCB names seen (16 Oct): 0081_001790.jpg -> video 0081 (before "_");
  # 0001052.jpg / 06000022.jpg (no "_") -> first 4 digits assumed = video. The second
  # case is a GUESS: check split_data.py --check-leakage output by eye.
  group_regex: '^(?P<src>\d+(?=_)|\d{4})'     # SCB subsets only

  # Subsets split by SCENE instead (file-name rules + picture fingerprint, src/ie4422/scenes.py).
  # Roboflow (checked 17 Oct): 772 photos, ~136 scenes; its own split leaks. PROJECT_PLAN D6.
  scene_subsets: [exam_cheating]
  scene_hamming_threshold: 5        # fingerprints this close = same scene. 10 merged different rooms
  big_scene:                        # a scene with this many photos goes to train only, thinned
    min_size: 60                    # Roboflow: burst session (252) and one video (~110)
    keep_every: 5

  leakage_hamming_threshold: 5      # dHash distance counted as a near-duplicate

  # SCB: at most N photos per source video in each pile, spread over the video (decisions #31, D7).
  # null = no cap. Set 18 Oct from the GPU timing test (0.68 s per training example; 4.4 s per
  # zero-shot answer, 1.5 s after LoRA). Test keeps a higher cap: BowTurnHead's test pile
  # (7 videos) carries most of the SCB RQ2 evidence.
  video_cap: {train: 20, val: 10, test: 30}

# ---------------------------------------------------------------------------
# Training data
# ---------------------------------------------------------------------------
build:
  # No answer balancing by default: balancing would break the "same image under
  # every rule" pairing that rule-contrastive training and the flip test need.
  # build_questions.py prints the positive rate per context; revisit after day 1.
  # Images are resized the way Qwen2.5-VL resizes them, and answer boxes are
  # written in THAT pixel space. Keep max_pixels identical in training and
  # inference, or boxes will be wrong.
  min_pixels: 3136                  # 56*56
  max_pixels: 1003520               # 1280*28*28

  # Which behaviours each question lists, decisions.md #30 (D8).
  #   labelled: only the behaviours labelled for that photo (after merging frames shared by
  #             several SCB subsets, #32). Each subset labels only its own classes; listing all
  #             5 would train "no one" answers for students nobody labelled, and teach the model
  #             to decide from the photo's style (the failure RQ2 tests).
  #   all:      every behaviour in rules.csv.
  behaviour_list: labelled

  # At most this many TRAINING photos whose listed behaviours are never flagged in a trained
  # setting (= hand-raising-only photos): their answer is always "no one" (decisions #33).
  # Val and test are not cut. null = no cap.
  max_train_nothing_to_flag: 500

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  # 18 Oct (decisions #39): 512 cut off 21/642 LoRA val answers at ~15 boxes (each box ~34
  # tokens; digits are single tokens). 1024 fits ~29 boxes; most in a val answer is 24.
  max_new_tokens: 1024
  temperature: 0.0                  # greedy, so results are repeatable

eval:
  iou_threshold: 0.5
  box_exclude: [using_phone]        # Roboflow boxes the phone, not the student (decisions #26)
  rq3_setting: closed_book_exam     # RQ3 = false flags on real exam scenes in this setting
